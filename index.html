<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06060c" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <script>
    // Cache killer.
    (function () {
      var APP_VER = '14';
      try {
        if (localStorage.getItem('app_ver') !== APP_VER) {
          localStorage.setItem('app_ver', APP_VER);
          var jobs = [];
          if (typeof caches !== 'undefined' && caches.keys) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function(){}));
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }).catch(function(){}));
          }
          if (jobs.length) Promise.all(jobs).then(function () { location.reload(); });
        }
      } catch (_) {}
    })();
    // Early theme apply (avoids flash of default theme on load).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('spectrum:v3') || 'null');
        var valid = ['midnight','slate','hacker','cayman'];
        var t = (s && s.ui && s.ui.theme && s.ui.theme.key) || 'midnight';
        if (valid.indexOf(t) === -1) t = 'midnight';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
  <title>The Spectrum — A Real-Life Social Operating System</title>
  <meta name="description" content="The Spectrum is a five-layer social operating system: real-life statuses, physical match, third-space proximity, identity & anonymity, and rapport with hobby-based teacher/student matching." />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop offset='0' stop-color='%2378f3d3'/><stop offset='1' stop-color='%237b6cff'/></linearGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23g)'/><circle cx='32' cy='32' r='10' fill='%230b0b12'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950:'#06060c', 900:'#0b0b12', 800:'#11111b', 700:'#181825', 600:'#1f1f30', 500:'#2a2a3f' },
            mint: { 400:'#78f3d3', 500:'#3ee0b6', 600:'#1bc498' },
            iris: { 400:'#9b8cff', 500:'#7b6cff', 600:'#5d4dff' },
            sun:  { 400:'#ffd073', 500:'#ffb43c', 600:'#e69112' },
            rose: { 400:'#ff8aa6', 500:'#ff5d80', 600:'#e23e62' },
          },
          fontFamily: { display: ['"Space Grotesk"','ui-sans-serif','system-ui'], sans:['Inter','ui-sans-serif','system-ui'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/spectrum.css?v=14" />
</head>
<body class="antialiased font-sans">
  <div id="app-root" class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 backdrop-blur border-b" style="background:color-mix(in srgb, var(--bg) 80%, transparent); border-color:var(--line)">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3">
        <a href="#/floor" class="flex items-center gap-2 group">
          <span class="block w-7 h-7 rounded-full ring-2 group-hover:ring-iris-500/50 transition" style="background:linear-gradient(135deg, var(--mint), var(--iris));"></span>
          <span class="font-display font-semibold tracking-tight text-lg">The&nbsp;Spectrum</span>
          <span class="hidden sm:inline text-xs build-label ml-1">build v14</span>
        </a>
        <nav id="nav" class="ml-auto flex items-center gap-1 overflow-x-auto whitespace-nowrap"></nav>
        <button id="status-pill" class="ml-2 hidden md:inline-flex items-center gap-2 text-xs px-2.5 py-1 rounded-full border border-ink-500 hover:border-mint-500 transition"></button>
      </div>
    </header>

    <main id="view" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6"></main>

    <footer class="border-t mt-10" style="border-color:var(--line)">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row gap-2 sm:items-center justify-between text-xs text-themed-mute">
        <p>The Spectrum augments in-person noticing — it does not replace it. Social proximity buckets, never exact locations.</p>
        <p>Local-first · build v14</p>
      </div>
    </footer>
  </div>

  <script type="module" src="./js/app.js?v=14"></script>
</body>
</html>
